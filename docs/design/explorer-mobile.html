<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chord Explorer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
a{color:#673d00}a:hover{color:#2b1700}
</style>
</helmet>
<div style="width:390px;height:1330px;box-sizing:border-box;background:#fff8f4;color:#211a14;font-family:Roboto,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">

<div style="height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 16px">
<h1 style="margin:0;font-size:22px;line-height:28px;font-weight:400">ChordTutor</h1>
<button type="button" aria-label="Settings" style="width:48px;height:48px;border:0;background:transparent;border-radius:24px;display:flex;align-items:center;justify-content:center;color:#50453a">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#50453a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
</button>
</div>

<nav aria-label="Main" style="flex:none;display:flex;border-bottom:1px solid #d4c4b5;padding:0 16px;margin-bottom:16px"><a href="#explorer" aria-current="page" style="display:flex;align-items:center;height:48px;padding:0 4px;font-size:14px;font-weight:500;letter-spacing:0.1px;color:#673d00;text-decoration:none;border-bottom:3px solid #845416;margin-bottom:-1px">Chord Explorer</a></nav>

<div style="padding:0 16px;display:flex;flex-direction:column;gap:20px">

<div style="display:flex;border:1px solid #827568;border-radius:22px;overflow:hidden;height:44px" role="group" aria-label="Instrument">
<button type="button" aria-pressed="true" style="flex:1;border:0;background:#feddbd;color:#58432c;font-size:14px;font-weight:500;letter-spacing:0.1px;display:flex;align-items:center;justify-content:center;gap:6px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#58432c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg>Guitar</button>
<button type="button" aria-pressed="false" style="flex:1;border:0;border-left:1px solid #827568;background:transparent;color:#211a14;font-size:14px;font-weight:500;letter-spacing:0.1px">Bass</button>
<button type="button" aria-pressed="false" style="flex:1;border:0;border-left:1px solid #827568;background:transparent;color:#211a14;font-size:14px;font-weight:500;letter-spacing:0.1px">Ukulele</button>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<div style="font-size:12px;line-height:16px;font-weight:500;letter-spacing:0.5px;color:#50453a">Root</div>
<div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px">
<button type="button" aria-pressed="true" style="height:44px;border:0;border-radius:12px;background:#845416;color:#ffffff;font-size:14px;font-weight:500">C</button>
<button type="button" style="height:44px;border:0;border-radius:12px;background:#f4e6da;color:#211a14;font-size:12px;font-weight:500">C#/Db</button>
<button type="button" style="height:44px;border:0;border-radius:12px;background:#f4e6da;color:#211a14;font-size:14px;font-weight:500">D</button>
<button type="button" style="height:44px;border:0;border-radius:12px;background:#f4e6da;color:#211a14;font-size:12px;font-weight:500">D#/Eb</button>
<button type="button" style="height:44px;border:0;border-radius:12px;background:#f4e6da;color:#211a14;font-size:14px;font-weight:500">E</button>
<button type="button" style="height:44px;border:0;border-radius:12px;background:#f4e6da;color:#211a14;font-size:14px;font-weight:500">F</button>
<button type="button" style="height:44px;border:0;border-radius:12px;background:#f4e6da;color:#211a14;font-size:12px;font-weight:500">F#/Gb</button>
<button type="button" style="height:44px;border:0;border-radius:12px;background:#f4e6da;color:#211a14;font-size:14px;font-weight:500">G</button>
<button type="button" style="height:44px;border:0;border-radius:12px;background:#f4e6da;color:#211a14;font-size:12px;font-weight:500">G#/Ab</button>
<button type="button" style="height:44px;border:0;border-radius:12px;background:#f4e6da;color:#211a14;font-size:14px;font-weight:500">A</button>
<button type="button" style="height:44px;border:0;border-radius:12px;background:#f4e6da;color:#211a14;font-size:12px;font-weight:500">A#/Bb</button>
<button type="button" style="height:44px;border:0;border-radius:12px;background:#f4e6da;color:#211a14;font-size:14px;font-weight:500">B</button>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<div style="font-size:12px;line-height:16px;font-weight:500;letter-spacing:0.5px;color:#50453a">Variant</div>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<button type="button" aria-pressed="true" style="min-height:44px;padding:0 16px;border:0;border-radius:8px;background:#ffddbb;color:#673d00;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#673d00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg>Major</button>
<button type="button" style="min-height:44px;padding:0 16px;border:1px solid #827568;border-radius:8px;background:transparent;color:#211a14;font-size:14px;font-weight:500">Minor</button>
<button type="button" style="min-height:44px;padding:0 16px;border:1px solid #827568;border-radius:8px;background:transparent;color:#211a14;font-size:14px;font-weight:500">7</button>
<button type="button" style="min-height:44px;padding:0 16px;border:1px solid #827568;border-radius:8px;background:transparent;color:#211a14;font-size:14px;font-weight:500">5</button>
<button type="button" style="min-height:44px;padding:0 16px;border:1px solid #827568;border-radius:8px;background:transparent;color:#211a14;font-size:14px;font-weight:500">dim</button>
<button type="button" style="min-height:44px;padding:0 16px;border:1px solid #827568;border-radius:8px;background:transparent;color:#211a14;font-size:14px;font-weight:500">dim7</button>
<button type="button" style="min-height:44px;padding:0 16px;border:1px solid #827568;border-radius:8px;background:transparent;color:#211a14;font-size:14px;font-weight:500">aug</button>
<button type="button" style="min-height:44px;padding:0 16px;border:1px solid #827568;border-radius:8px;background:transparent;color:#211a14;font-size:14px;font-weight:500">sus2</button>
<button type="button" style="min-height:44px;padding:0 16px;border:1px solid #827568;border-radius:8px;background:transparent;color:#211a14;font-size:14px;font-weight:500">sus4</button>
<button type="button" style="min-height:44px;padding:0 16px;border:1px solid #827568;border-radius:8px;background:transparent;color:#211a14;font-size:14px;font-weight:500">maj7</button>
<button type="button" style="min-height:44px;padding:0 16px;border:1px solid #827568;border-radius:8px;background:transparent;color:#211a14;font-size:14px;font-weight:500">m7</button>
<button type="button" style="min-height:44px;padding:0 16px;border:1px solid #827568;border-radius:8px;background:transparent;color:#211a14;font-size:14px;font-weight:500">7sus4</button>
</div>
</div>

<div style="background:#fff1e6;border-radius:28px;padding:20px 16px 16px;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;align-items:flex-end;justify-content:space-between;padding:0 4px">
<div>
<h2 style="margin:0;font-size:36px;line-height:44px;font-weight:400">C Major</h2>
<div style="font-size:16px;line-height:24px;letter-spacing:0.5px;color:#50453a">C &#8211; E &#8211; G</div>
</div>
<div style="display:flex;align-items:center;gap:8px;min-height:44px">
<span id="triad-label" style="font-size:14px;font-weight:500;letter-spacing:0.1px">Triad only</span>
<button type="button" role="switch" aria-checked="false" aria-labelledby="triad-label" style="width:52px;height:32px;border:2px solid #827568;border-radius:16px;background:#eee0d5;position:relative;padding:0"><span style="position:absolute;left:6px;top:6px;width:16px;height:16px;border-radius:8px;background:#827568"></span></button>
</div>
</div>

<g font-size="11" fill="#50453a" font-weight="500"><text x="36" y="11">E</text><text x="86" y="11">A</text><text x="136" y="11">D</text><text x="186" y="11">G</text><text x="236" y="11">B</text><text x="286" y="11">E</text></g>
<g font-size="12" fill="#50453a"><text x="12" y="90">1</text><text x="12" y="150">2</text><text x="12" y="210">3</text><text x="12" y="270">4</text><text x="12" y="330">5</text></g>

<circle cx="286" cy="32" r="15" fill="#56633b"/><text x="286" y="33" font-size="12" font-weight="500" fill="#ffffff">E</text><text x="286" y="43" font-size="8" fill="#ffffff">3</text>
<circle cx="86" cy="206" r="24" fill="none" stroke="#845416" stroke-width="2"/><circle cx="86" cy="206" r="19" fill="#845416"/><text x="86" y="209" font-size="16" font-weight="500" fill="#ffffff">C</text><text x="86" y="222" font-size="10" fill="#ffffff">1</text>
<circle cx="136" cy="146" r="19" fill="#56633b"/><text x="136" y="149" font-size="16" font-weight="500" fill="#ffffff">E</text><text x="136" y="162" font-size="10" fill="#ffffff">3</text>
<circle cx="236" cy="86" r="24" fill="none" stroke="#845416" stroke-width="2"/><circle cx="236" cy="86" r="19" fill="#845416"/><text x="236" y="89" font-size="16" font-weight="500" fill="#ffffff">C</text><text x="236" y="102" font-size="10" fill="#ffffff">1</text>
</g>
</svg>

<div style="display:flex;align-items:center;gap:12px;padding:0 4px">
<span style="font-size:12px;font-weight:500;letter-spacing:0.5px;color:#50453a;flex:none">Voicing</span>
<button type="button" aria-pressed="true" aria-label="Voicing 1" style="width:44px;height:44px;border:0;border-radius:22px;background:#845416;color:#ffffff;font-size:14px;font-weight:500">1</button>
<button type="button" aria-label="Voicing 2" style="width:44px;height:44px;border:1px solid #827568;border-radius:22px;background:transparent;color:#211a14;font-size:14px;font-weight:500">2</button>
<button type="button" aria-label="Voicing 3" style="width:44px;height:44px;border:1px solid #827568;border-radius:22px;background:transparent;color:#211a14;font-size:14px;font-weight:500">3</button>
<button type="button" aria-label="Voicing 4" style="width:44px;height:44px;border:1px solid #827568;border-radius:22px;background:transparent;color:#211a14;font-size:14px;font-weight:500">4</button>
</div>

<div style="background:#fff8f4;border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:center;gap:12px;font-size:14px;line-height:20px;letter-spacing:0.25px">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="none" stroke="#845416" stroke-width="2"/><circle cx="14" cy="14" r="9" fill="#845416"/></svg>
<span><b style="font-weight:500">1</b> Root: C</span></div>
<div style="display:flex;align-items:center;gap:12px;font-size:14px;line-height:20px;letter-spacing:0.25px">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="9" fill="#56633b"/></svg>
<span><b style="font-weight:500">3</b> Major third: E</span></div>
<div style="display:flex;align-items:center;gap:12px;font-size:14px;line-height:20px;letter-spacing:0.25px">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="9" fill="#e0c1a3" stroke="#827568" stroke-width="1.5"/></svg>
<span><b style="font-weight:500">5</b> Perfect fifth: G</span></div>
</div>
</div>

<div style="display:flex;justify-content:center;padding:4px 0 16px">
<a href="#consent" style="display:flex;align-items:center;min-height:44px;font-size:12px;letter-spacing:0.4px">Privacy settings</a>
</div>
