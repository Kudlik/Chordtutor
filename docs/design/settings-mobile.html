<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
a{color:#673d00}a:hover{color:#2b1700}
</style>
</helmet>
<div style="width:390px;height:720px;box-sizing:border-box;background:#fff8f4;color:#211a14;font-family:Roboto,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">

<div style="height:64px;flex:none;display:flex;align-items:center;gap:4px;padding:0 4px">
<a href="Main.dc.html" aria-label="Back to Chord Explorer" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#50453a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<h1 style="margin:0;font-size:22px;line-height:28px;font-weight:400">Settings</h1>
</div>

<div style="padding:8px 16px 0;display:flex;flex-direction:column;gap:28px">

<section style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px">
<div style="display:flex;flex-direction:column">
<span id="lh-label" style="font-size:16px;line-height:24px;font-weight:500;letter-spacing:0.15px">Left-handed mode</span>
<span style="font-size:12px;line-height:16px;letter-spacing:0.4px;color:#50453a">Mirrors the fretboard. The nut moves to the right.</span>
</div>
<button type="button" role="switch" aria-checked="false" aria-labelledby="lh-label" style="flex:none;width:52px;height:32px;border:2px solid #827568;border-radius:16px;background:#eee0d5;position:relative;padding:0"><span style="position:absolute;left:6px;top:6px;width:16px;height:16px;border-radius:8px;background:#827568"></span></button>
</div>
<div style="display:flex;gap:16px">
<figure style="margin:0;flex:1;background:#fff1e6;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px">
<svg width="120" height="48" viewBox="0 0 120 48" role="img" aria-label="Right-handed: nut on the left" style="display:block"><rect x="4" y="6" width="112" height="36" fill="#fff8f4"/><line x1="4" y1="6" x2="4" y2="42" stroke="#50453a" stroke-width="5"/><g stroke="#d4c4b5" stroke-width="1.5"><line x1="40" y1="6" x2="40" y2="42"/><line x1="76" y1="6" x2="76" y2="42"/><line x1="112" y1="6" x2="112" y2="42"/></g><g stroke="#827568"><line x1="4" y1="12" x2="116" y2="12"/><line x1="4" y1="24" x2="116" y2="24"/><line x1="4" y1="36" x2="116" y2="36"/></g></svg>
<figcaption style="font-size:12px;line-height:16px;letter-spacing:0.4px;color:#50453a">Right-handed</figcaption>
</figure>
<figure style="margin:0;flex:1;background:#fff1e6;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px">
<svg width="120" height="48" viewBox="0 0 120 48" role="img" aria-label="Left-handed: nut on the right" style="display:block"><rect x="4" y="6" width="112" height="36" fill="#fff8f4"/><line x1="116" y1="6" x2="116" y2="42" stroke="#50453a" stroke-width="5"/><g stroke="#d4c4b5" stroke-width="1.5"><line x1="80" y1="6" x2="80" y2="42"/><line x1="44" y1="6" x2="44" y2="42"/><line x1="8" y1="6" x2="8" y2="42"/></g><g stroke="#827568"><line x1="4" y1="12" x2="116" y2="12"/><line x1="4" y1="24" x2="116" y2="24"/><line x1="4" y1="36" x2="116" y2="36"/></g></svg>
<figcaption style="font-size:12px;line-height:16px;letter-spacing:0.4px;color:#50453a">Left-handed</figcaption>
</figure>
</div>
</section>

<section style="display:flex;flex-direction:column;gap:8px">
<h2 style="margin:0;font-size:14px;line-height:20px;font-weight:500;letter-spacing:0.1px;color:#50453a">Language</h2>
<div style="display:flex;border:1px solid #827568;border-radius:22px;overflow:hidden;height:44px" role="group" aria-label="Language">
<button type="button" aria-pressed="true" style="flex:1;border:0;background:#feddbd;color:#58432c;font-size:14px;font-weight:500;letter-spacing:0.1px;display:flex;align-items:center;justify-content:center;gap:6px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#58432c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg>English</button>
<button type="button" aria-pressed="false" style="flex:1;border:0;border-left:1px solid #827568;background:transparent;color:#211a14;font-size:14px;font-weight:500;letter-spacing:0.1px">Polski</button>
</div>
</section>

<section style="border-top:1px solid #d4c4b5;padding-top:4px">
<a href="#consent" style="display:flex;align-items:center;justify-content:space-between;min-height:56px;color:#211a14;font-size:16px;letter-spacing:0.5px;text-decoration:none">
<span>Analytics preferences</span>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#50453a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
</a>
</section>

<section style="border-top:1px solid #d4c4b5;padding-top:16px;display:flex;flex-direction:column;gap:4px">
<p style="margin:0;font-size:14px;line-height:20px;letter-spacing:0.25px;color:#50453a">Created by Maciek Jaskulski</p>
<div style="display:flex;gap:16px">
<a href="https://www.instagram.com/last_page_doodle/" target="_blank" rel="noopener noreferrer" style="display:flex;align-items:center;min-height:44px;font-size:14px;font-weight:500;letter-spacing:0.1px">Instagram</a>
<a href="https://open.spotify.com/artist/0PDkjNbQApHnU8wLwpKKv6?si=GRyMhPhkSkGc1rtHfKigyg" target="_blank" rel="noopener noreferrer" style="display:flex;align-items:center;min-height:44px;font-size:14px;font-weight:500;letter-spacing:0.1px">Spotify</a>
</div>
</section>

</div>
</div>
</x-dc>

</body>
</html>
